<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusPe Assistant</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 600;
      color: #38bdf8;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 16px 0;
      line-height: 1.4;
    }
    .field-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-fill {
      background: #0284c7;
      color: white;
    }
    .btn-fill:hover {
      background: #0369a1;
    }
    .btn-submit {
      background: #16a34a;
      color: white;
    }
    .btn-submit:hover {
      background: #15803d;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      color: #38bdf8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>CampusPe Auto-Apply</h2>
  <p>Runs directly in your active browser session to fill fields and submit.</p>
  
  <div class="field-group">
    <label>Full Name</label>
    <input type="text" id="name" value="Student Candidate" />
  </div>
  <div class="field-group">
    <label>Email</label>
    <input type="email" id="email" value="student@example.com" />
  </div>
  <div class="field-group">
    <label>Phone</label>
    <input type="tel" id="phone" value="+15551234567" />
  </div>
  <div class="field-group">
    <label>LinkedIn</label>
    <input type="url" id="linkedin" value="https://linkedin.com/in/student" />
  </div>
  <div class="field-group">
    <label>GitHub</label>
    <input type="url" id="github" value="https://github.com/student" />
  </div>

  <button id="btnFill" class="btn-fill">1. Fill Application Form</button>
  <button id="btnFillSubmit" class="btn-submit">2. Fill & Auto-Submit</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
